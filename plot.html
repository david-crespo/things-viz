<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Things Viz</title>
    <style>
      :root {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }
      #controls {
        padding: 1rem 20px;
      }
      #breakdown-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.25rem;
        padding: 0 20px;
      }
      #breakdown-legend label {
        cursor: pointer;
        user-select: none;
        padding: 0.125rem 0.375rem;
        border-radius: 4px;
        border: 1px solid transparent;
      }
      #breakdown-legend label:hover {
        border-color: #999;
      }
      #legend-help {
        padding: 0.25rem 20px;
        color: #666;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>Start: <input type="date" name="start" onchange="render()" /></label>
      <label>End: <input type="date" name="end" onchange="render()" /></label>
      <button onclick="renderLast(30)">30d</button>
      <button onclick="renderLast(90)">90d</button>
      <button onclick="renderLast(365)">1y</button>
      <button onclick="renderLast(365 * 2)">2y</button>
      <button onclick="renderAll()">all</button>
    </div>
    <div id="breakdown-legend"></div>
    <div id="legend-help">Click to solo, shift+click to toggle</div>
    <div id="plots"></div>

    <script type="module">
      import * as Plot from 'https://esm.sh/@observablehq/plot@0.6'

      const rawData = /*__DATA__*/ []
      const reconcileAreaSelection = /*__RECONCILE_SELECTION__*/ () => {}

      const dateToStr = (d) => d.toISOString().slice(0, 10)

      const getPlot = (title, data, colorScale) =>
        Plot.plot({
          width: 960,
          marginRight: 80,
          style: 'overflow: visible;',
          y: { grid: true },
          color: colorScale,
          title,
          marks: [
            Plot.lineY(data, { x: 'date', y: 'count', stroke: 'area' }),
            Plot.text(
              data,
              Plot.selectLast({
                x: 'date',
                y: 'count',
                z: 'area',
                text: 'label',
                textAnchor: 'start',
                dx: 3,
              }),
            ),
          ],
        })

      const getStartInput = () => document.querySelector('input[name=start]')
      const getEndInput = () => document.querySelector('input[name=end]')

      // Keep implicit "all" distinct from an explicit subset so a wider date range can
      // introduce older areas without silently filtering them out.
      let areaSelection = { mode: 'all' }
      let areaSelectionInitialized = false
      let allAreas = [] // store full domain for "show all" behavior

      // Read initial area filter from URL (supports multiple ?area=X&area=Y params)
      function getUrlAreas() {
        const params = new URLSearchParams(window.location.search)
        const areas = params.getAll('area')
        return areas.length > 0 ? areas : null
      }

      function updateUrlAreas() {
        const params = new URLSearchParams(window.location.search)
        params.delete('area')
        if (areaSelection.mode === 'subset' && areaSelection.areas.size < allAreas.length) {
          for (const area of areaSelection.areas) {
            params.append('area', area)
          }
        }
        const newUrl = params.toString()
          ? `${window.location.pathname}?${params}`
          : window.location.pathname
        window.history.replaceState({}, '', newUrl)
      }

      function buildLegend(colorScale, labels) {
        const legendDiv = document.querySelector('#breakdown-legend')
        if (!colorScale) return

        const { domain, range } = colorScale
        allAreas = domain

        if (!areaSelectionInitialized) {
          const urlAreas = getUrlAreas()
          if (urlAreas) {
            const validAreas = urlAreas.filter((a) => domain.includes(a))
            if (validAreas.length > 0) {
              areaSelection = { mode: 'subset', areas: new Set(validAreas) }
            }
          }
          areaSelectionInitialized = true
        }
        areaSelection = reconcileAreaSelection(areaSelection, domain)
        const selectedAreas =
          areaSelection.mode === 'all' ? new Set(domain) : areaSelection.areas

        legendDiv.innerHTML = ''
        domain.forEach((area, i) => {
          const label = document.createElement('label')

          const checkbox = document.createElement('input')
          checkbox.type = 'checkbox'
          checkbox.checked = selectedAreas.has(area)
          checkbox.style.accentColor = range[i]

          label.append(checkbox, ' ', labels.get(area) ?? area)
          label.onclick = (e) => {
            e.preventDefault()
            if (e.shiftKey) {
              // Shift+click: toggle this area
              if (selectedAreas.has(area)) {
                selectedAreas.delete(area)
              } else {
                selectedAreas.add(area)
              }
              areaSelection =
                selectedAreas.size === 0 || selectedAreas.size === domain.length
                  ? { mode: 'all' }
                  : { mode: 'subset', areas: selectedAreas }
            } else {
              // Click: solo this area (or show all if already solo)
              if (selectedAreas.size === 1 && selectedAreas.has(area)) {
                areaSelection = { mode: 'all' }
              } else {
                areaSelection = { mode: 'subset', areas: new Set([area]) }
              }
            }
            updateUrlAreas()
            render()
          }

          legendDiv.append(label)
        })
      }

      function render() {
        const start = new Date(getStartInput().value)
        const end = new Date(getEndInput().value)

        const allData = rawData
          .map(({ date, ...rest }) => ({ date: new Date(date), ...rest }))
          .filter(({ date }) => date >= start && date <= end)

        const breakdownData = allData.filter(
          ({ kind }) => kind === 'area' || kind === 'unassigned',
        )
        const areaLabels = new Map(breakdownData.map(({ area, label }) => [area, label]))

        // First render with all data to get color scale for legend
        const fullBreakdownPlot = getPlot('Items by Area', breakdownData)
        const colorScale = fullBreakdownPlot.scale('color')
        buildLegend(colorScale, areaLabels)

        const selectedAreas =
          areaSelection.mode === 'all' ? new Set(allAreas) : areaSelection.areas
        const filteredBreakdownData = breakdownData.filter(({ area }) =>
          selectedAreas.has(area),
        )

        // Pass fixed color scale so colors don't shift when filtering
        const breakdownPlot = getPlot('Items by Area', filteredBreakdownData, colorScale)

        const totalPlot = getPlot(
          'Total',
          allData.filter(({ kind }) => kind === 'total'),
        )

        const completionsData = allData.filter(({ kind }) => kind === 'completion-average')

        const completionsPlot = getPlot(
          'Completions (30 day moving average)',
          completionsData,
        )

        const div = document.querySelector('#plots')
        div.innerHTML = ''
        div.append(breakdownPlot)
        div.append(totalPlot)
        div.append(completionsPlot)
      }

      function daysAgo(n) {
        const today = new Date()
        const start = new Date()
        start.setDate(today.getDate() - n)
        return start
      }

      function renderLast(n) {
        getStartInput().value = dateToStr(daysAgo(n))
        getEndInput().value = dateToStr(daysAgo(-1))
        render()
      }

      renderLast(365)

      function renderAll() {
        getStartInput().value = rawData[0].date
        getEndInput().value = dateToStr(daysAgo(-1))
        render()
      }

      window.render = render
      window.renderLast = renderLast
      window.renderAll = renderAll
    </script>
  </body>
</html>
